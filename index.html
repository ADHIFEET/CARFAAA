<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Driving - GTA Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: #ffcc00;
            text-transform: uppercase;
        }
        .controls {
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
        }
        #speedometer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Grand Theft Auto: Mini 3D</h1>
        <div class="controls">
            <p><strong>W / Up Arrow:</strong> Accelerate</p>
            <p><strong>S / Down Arrow:</strong> Reverse / Brake</p>
            <p><strong>A / Left Arrow:</strong> Turn Left</p>
            <p><strong>D / Right Arrow:</strong> Turn Right</p>
        </div>
    </div>
    <div id="speedometer">0 KM/H</div>

    <script>
        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 300;
        const d = 100;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- Environment & City ---
        const gridSize = 400;
        const roadWidth = 14;

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(gridSize, gridSize);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e353b, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Building Procedural Generation
        const buildingColors = [0xdddddd, 0x336699, 0x883333, 0x448844, 0xcc9933, 0x555555];
        const buildings = [];

        function createCityBlock(x, z, width, depth) {
            const numBuildings = 4;
            const subW = width / 2 - 2;
            const subD = depth / 2 - 2;

            for (let bx = 0; bx < 2; bx++) {
                for (let bz = 0; bz < 2; bz++) {
                    const height = 15 + Math.random() * 45;
                    const posX = x - width/4 + bx * (width/2);
                    const posZ = z - depth/4 + bz * (depth/2);

                    const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                    const bGeo = new THREE.BoxGeometry(subW, height, subD);
                    const bMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
                    const building = new THREE.Mesh(bGeo, bMat);
                    
                    building.position.set(posX, height / 2, posZ);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    scene.add(building);
                    buildings.push(building);
                }
            }
        }

        // Grid City Layout
        const blockSize = 60;
        for (let x = -150; x <= 150; x += blockSize) {
            for (let z = -150; z <= 150; z += blockSize) {
                createCityBlock(x, z, blockSize - roadWidth, blockSize - roadWidth);
            }
        }

        // --- Car Creation ---
        const carGroup = new THREE.Group();

        // Car Body
        const bodyGeo = new THREE.BoxGeometry(2.2, 1, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.2, metalness: 0.8 }); // Vibrant Red
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.8;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Cabin/Roof
        const cabinGeo = new THREE.BoxGeometry(1.8, 0.8, 2.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.5, -0.3);
        cabin.castShadow = true;
        carGroup.add(cabin);

        // Headlights
        const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
        const leftLight = new THREE.Mesh(lightGeo, lightMat);
        leftLight.position.set(-0.8, 0.8, 2.26);
        const rightLight = leftLight.clone();
        rightLight.position.set(0.8, 0.8, 2.26);
        carGroup.add(leftLight);
        carGroup.add(rightLight);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const wheelPositions = [
            [-1.1, 0.4, 1.4],  // Front Left
            [ 1.1, 0.4, 1.4],  // Front Right
            [-1.1, 0.4, -1.4], // Rear Left
            [ 1.1, 0.4, -1.4]  // Rear Right
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            carGroup.add(wheel);
        });

        scene.add(carGroup);

        // --- Physics & Controls ---
        const keys = { w: false, a: false, s: false, d: false };
        let speed = 0;
        let maxSpeed = 0.8;
        let acceleration = 0.015;
        let friction = 0.98;
        let turnSpeed = 0.03;

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = true;
            if (k === 's' || k === 'arrowdown') keys.s = true;
            if (k === 'a' || k === 'arrowleft') keys.a = true;
            if (k === 'd' || k === 'arrowright') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = false;
            if (k === 's' || k === 'arrowdown') keys.s = false;
            if (k === 'a' || k === 'arrowleft') keys.a = false;
            if (k === 'd' || k === 'arrowright') keys.d = false;
        });

        // --- Animation Loop ---
        const speedometer = document.getElementById('speedometer');

        function animate() {
            requestAnimationFrame(animate);

            // Acceleration
            if (keys.w) speed += acceleration;
            if (keys.s) speed -= acceleration;

            // Speed limits
            if (speed > maxSpeed) speed = maxSpeed;
            if (speed < -maxSpeed / 2) speed = -maxSpeed / 2;

            // Friction
            speed *= friction;

            // Steering (reversed when going backward)
            if (Math.abs(speed) > 0.01) {
                const turnDir = speed > 0 ? 1 : -1;
                if (keys.a) carGroup.rotation.y += turnSpeed * turnDir;
                if (keys.d) carGroup.rotation.y -= turnSpeed * turnDir;
            }

            // Move Car
            carGroup.translateZ(speed);

            // Camera Following Logic
            const cameraOffset = new THREE.Vector3(0, 5, -12);
            const relativeOffset = cameraOffset.applyMatrix4(carGroup.matrixWorld);
            camera.position.lerp(relativeOffset, 0.1);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1.5, carGroup.position.z);

            // Update UI
            speedometer.innerText = `${Math.round(Math.abs(speed) * 120)} KM/H`;

            renderer.render(scene, camera);
        }

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
